name: Deploy Content to for-sentinel [fc5d265f-f636-4c2f-9dbf-e2cd7d31632a]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-fc5d265f-f636-4c2f-9dbf-e2cd7d31632a.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-fc5d265f-f636-4c2f-9dbf-e2cd7d31632a.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'sentinel'
      workspaceName: 'for-sentinel'
      workspaceId: '67a6b727-99f4-4685-ad8c-f2feab35a1f8'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'AnalyticsRule,HuntingQuery'
      branch: 'main'
      sourceControlId: 'fc5d265f-f636-4c2f-9dbf-e2cd7d31632a'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_fc5d265ff6364c2f9dbfe2cd7d31632a }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_fc5d265ff6364c2f9dbfe2cd7d31632a }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_fc5d265ff6364c2f9dbfe2cd7d31632a }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_fc5d265ff6364c2f9dbfe2cd7d31632a }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_fc5d265ff6364c2f9dbfe2cd7d31632a }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_fc5d265ff6364c2f9dbfe2cd7d31632a }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_fc5d265ff6364c2f9dbfe2cd7d31632a }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_fc5d265ff6364c2f9dbfe2cd7d31632a }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_fc5d265ff6364c2f9dbfe2cd7d31632a }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-fc5d265f-f636-4c2f-9dbf-e2cd7d31632a.ps1